name: FreeBSD

on: [push, pull_request]

env:
  FORCE_COLOR: 1

jobs:
  parameters:
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      versions: ${{ steps.releases.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: .github/checkout/freebsd-vm
          repository: vmactions/freebsd-vm
          sparse-checkout: conf

      # https://github.com/vmactions/freebsd-vm/blob/-/conf
      - id: releases
        run: |
          ls -1 .github/checkout/freebsd-vm/conf | tee -a /dev/stderr |
          jq -cnrR '[inputs]
          # greatest per major version
          | map(capture("(?<value>(?<key>[0-9]+)[.0-9]+)(?!conf)"))
          | group_by(.key) | map(max_by(.value | split(".") | map(tonumber)))
          | ("matrix=\(map(.value))", "versions=\(from_entries)")' |
          tee -a "${GITHUB_OUTPUT}"

  freebsd:
    runs-on: ubuntu-latest
    needs: [parameters]
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.parameters.outputs.matrix) }}
        shell:
          - sh
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: ${{ matrix.release }}
          run: SH='${{ matrix.shell }}' contrib/various_test.sh
