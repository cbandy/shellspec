# https://www.msys2.org/docs/ci
name: Windows MSYS

on: [push, pull_request]

env:
  FORCE_COLOR: 1

defaults:
  run:
    shell: msys2 {0}

jobs:
  windows-msys:
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    # https://github.com/actions/runner-images/blob/-/images/windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - sh
          - dash
          - bash
          - busybox ash
          - mksh
          - zsh
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: ${{ case(matrix.shell == 'busybox ash', 'busybox', matrix.shell) }}
      - run: env '-S ${{ matrix.shells.shell }}' ./shellspec --task fixture:stat:prepare
      - run: env '-S ${{ matrix.shells.shell }}' ./shellspec
