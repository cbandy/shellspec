name: Windows GitBash

on: [push, pull_request]

env:
  PATH: 'C:\Program Files\Git\bin;C:\windows\system32;C:\windows'
  FORCE_COLOR: 1

defaults:
  run:
    shell: bash

jobs:
  windows-gitbash:
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    # https://github.com/actions/runner-images/blob/-/images/windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - sh
          - dash
          - bash
    steps:
      - uses: actions/checkout@v6
      - run: env '${{ matrix.shell }}' ./shellspec --task fixture:stat:prepare
      - run: env '${{ matrix.shell }}' ./shellspec
