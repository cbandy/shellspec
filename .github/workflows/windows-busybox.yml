name: Windows BusyBox

on: [push, pull_request]

env:
  PATH: 'C:\Program Files\Git\bin;C:\Windows\System32;C:\Windows;C:\ProgramData\Chocolatey\bin'
  FORCE_COLOR: 1

defaults:
  run:
    shell: cmd

jobs:
  windows-busybox:
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    # https://github.com/actions/runner-images/blob/-/images/windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # https://community.chocolatey.org/packages/busybox
        release:
          - 5398.0.0 # https://frippery.org/busybox/release-notes/FRP-5398.html
          - 5467.0.0 # https://frippery.org/busybox/release-notes/FRP-5467.html
          - 5579.0.0 # https://frippery.org/busybox/release-notes/FRP-5579.html
          - 5857.0.0 # https://frippery.org/busybox/release-notes/FRP-5857.html
        shell:
          - sh
          - ash
          - bash
    steps:
      - uses: actions/checkout@v6
      - run: choco install --yes --no-progress busybox --version='${{ matrix.release }}'
      - run: busybox env '${{ matrix.shell }}' ./shellspec --task fixture:stat:prepare
      - run: busybox env '${{ matrix.shell }}' ./shellspec
